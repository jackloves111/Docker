version: '3.8'

services:
  dockerpilot:
    build: .
    container_name: dockerpilot
    ports:
      - "${APP_PORT:-20250}:20250"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config
    environment:
      - DOCKER_SOCKET=/var/run/docker.sock
      - APP_PORT=20250
    restart: unless-stopped
