app:
  host: "0.0.0.0"
  port: 3006
  debug: false
  data_dir: "/config"
  log_level: "INFO"
  log_file: "/config/updater.log"

docker:
  socket_path: "/var/run/docker.sock"

scheduler:
  default_interval: 60
  default_enabled: true

download:
  temp_dir: "/tmp/dockertarupdater/downloads"
  timeout: 300
  max_retries: 3

notifications:
  web_enabled: true
